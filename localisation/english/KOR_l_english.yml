 a_proud_nation: "The Last Ilje Sidae"
 a_proud_nation_desc: "Ilje Sidae, meaning "Japanese colonial era", is an event that cannot repeat in Korean history. Every Korean will do his part to defend his nation, even if it means death before subjugation."
 a_proud_nation_2: "The Last Ilje Sidae"
 a_proud_nation_2_desc: "Ilje Sidae, meaning "Japanese colonial era", is an event that cannot repeat in Korean history. Every Korean will do his part to defend his nation, even if it means death before subjugation."
 destroyed_army: "Destroyed Army"
 destroyed_army_desc: "The Korean army was disbanded by the Japanese forces after the occupation began. Now the Korean army is just a group of semi-independent militias led by former generals or guerrilla leaders, which the only common objective of defending Korea from the foreign invasions. Nonetheless, conflicts between different political ideologies end up in militias abandoning other to their fate in mid of combat, or even guerrillas fighting each other. If we want to be able to defend our nation, we must train a professional army, or unify the militias under one command."
 struggling_economy: "Struggling Economy"
 struggling_economy_desc: "The Korean economy has beem exploited by the Japanese since the occupation began, and thus the economic growth of Korea has been infimum. We must attempt to industrialize as the Japanese did before we fall behind the rest of the world."
