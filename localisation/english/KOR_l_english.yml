 KOR_recall_yi_un_to_active_service: "Ask Yi Un to Command Our Forces"
 KOR_recall_kim_koo: "Recall Kim Koo to Active Service"
 KOR_recall_kim_koo_to_active_service: "The Lion of Shanghai Shall Fight Again"
 KOR_caesar_and_brutus: "Caesar and Brutus"
 KOR_caesar_and_brutus_desc: "When Heo Im proclaimed himself as the absolute leader of Korea, many politicians began antagonizing him. It wouldn't be a big problem by itself if it wasn't for the fact that this brought the attention of army chief Lee Beom-seok, who began aligning with the opposition. Heo must show the people of Korea that if he is going to be a dictator, at least he's going to improve the situation of the country."
 KOR_allow_women_in_the_airforce: "Allow Women in the Airforce"
 KOR_allow_women_in_the_airforce_desc: "Park Kyung-won and Gwon Gi-ok are famous for their abilities as pilots, we wouldn't loose anything for allowing them to train more women to join the airforce."
 KOR_purges: "Purge the Unwanted"
 KOR_purges_desc: "Anyone contrary to our government is not needed in the new Korea under our great leader."
