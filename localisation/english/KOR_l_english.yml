 KOR_reorganize_the_nation: "Reorganize the Nation"
 KOR_reorganize_the_nation_desc: "Now Korea is united in its cause against the Japanese, however once we reach peace with them, the power vaccum in Korea will be unstopable. We must reorganize our government and consolidate our power if we want not to be an easy target for the Japanese."
 KOR_become_the_bastion: "Become the Bastion"
 KOR_become_the_bastion_desc: "Asia is nowadays the land of the shadows, anarchy reigns in the China, the Japanese sun menaces the liberty of the region and the Soviets and Mongols wish for dye the continent red. We must act as the beacon of hope in these dire times."
 KOR_ignite_the_torch: "Ignite the Torch"
 KOR_ignite_the_torch_desc: "We must become the light in the shadows, let's ignite our torches!"
 KOR_defend_korea: "Defend Korea"
 KOR_defend_korea_desc: "Every Korean must be willing to defend Asia and his nation if we want to have peace."
 KOR_arrest_corrupt_politicians: "Arrest Corrupt Politicians"
 KOR_arrest_corrupt_politicians_desc: "Korea is no place for corrupt politicians and Japanese collaborationists. All those who dare to oppose stability in our nation will be punished."
 KOR_every_democrat_a_warrior: "Every Democrat a Warrior"
 KOR_every_democrat_a_warrior_desc: "Inspiring on the Légion étrangère in France, we must create a new army brigade, but consisting of exiles and people willing to fight for democracy all over Asia."
 KOR_purge_the_communists: "Purge the Communists"
 KOR_purge_the_communists_desc: "Kim Il-sung and Shin Chae-ho are no more than radical agitators opposed to democracy. If we want to achieve stability in Korea, we will have to get rid of them."
 KOR_join_allies: "Join the Allies"
 KOR_join_allies_desc: "Democracy is currently menaced by fascist and communist dictatorships. If we want to be able to impede our downfall, we must look for allies."
 KOR_the_rising_sun_must_set: "The Rising Sun Must Set"
 KOR_the_rising_sun_must_set_desc: "There won't be peace on Asia if Japan keeps expanding. The Rising Sun must set."
 KOR_the_david_in_the_land_of_goliaths: "The David in the Land of Goliaths"
 KOR_the_david_in_the_land_of_goliaths_desc: "Just like David defeated Goliath in the biblical allegory, we will be prepared to defeat the Goliaths of the West and the East."
 KOR_begin_industralization: "Industrialize the Metropolis"
 KOR_begin_industralization_desc: "Korea has an agrarian society. We must industrialize as the Japanese did to be able to defeat our enemies in Asia and the rest of the world."
 KOR_continue_industralization: "Industrialize the Countryside"
 KOR_continue_industralization_desc: "Korea still has an agrarian society. We must industrialize as the Japanese did to be able to defeat our enemies in Asia and the rest of the world."
 KOR_finish_industralization: "Industrialized Society"
 KOR_finish_industralization_desc: "We have achieved industrialization as the Japanese once did. We are getting closer to becoming a major power in Asia."
 KOR_improve_our_industry: "Work on Industrial Efficiency"
 KOR_improve_our_industry_desc: "We should improve our industries to increase our production."
 KOR_improve_our_research: "Work on Research Efficiency"
 KOR_improve_our_research_desc: "We should improve our research techniques so we can make quicker investigations."
 KOR_trade_deals: "Foreign Investiments"
 KOR_trade_deals_desc: "In order to get more money for our country, we will sign trade deals with other nations."
 KOR_arms_deals: "Foreign Arms Building"
 KOR_arms_deals_desc: "In order to get more arms for our country, we will sign deals with other nations."
 KOR_free_trade_deals_with_the_americas: "Free-trade Deals with the Americas"
 KOR_free_trade_deals_with_the_americas_desc: "Enacting free-trade deals with the Americas will surely help to improve our trade capabilities as well as our economy."
 KOR_close_the_country: "Close the Peninsula"
 KOR_close_the_country_desc: "Our people's mind will not be poisoned by the ideas of the rest of the world. Our frontiers will be closed until our people has been educated."
 KOR_the_korean_miracle: "The Korean Miracle"
 KOR_the_korean_miracle_desc: "Incredibly, Korea has managed to reactivate its economy, however, if this is going to work in the long run is still unknown."
 KOR_expand_universities: "University Building"
 KOR_expand_universities_desc: "We will expand our universities so we can get better scientists."
 KOR_encourage_research: "Encourage Research"
 KOR_encourage_research_desc: "We will encourage research so we can get better technologies."
 KOR_rearm_the_country: "Rearm the Country"
 KOR_rearm_the_country_desc: "The Uibyeong, or "Righteous Armies" are civilian militias that have appeared several times in Korean history, when the national armies were in need of assistance. However, after our armies were disbanded by Japan, the Uibyeong became the only option our government had to fight. But now the question is, should we try modernize our army, or stick with the Uibyeong strategy that defended our nation during the great revolt?"
 KOR_continue_the_uibyeong_strategy: "Continue the Uibyeong Strategy"
 KOR_continue_the_uibyeong_strategy_desc: "The Korean government has decided to continue the Uibyeong strategy, and thus our doctrine will base around guerrilla warfare and probing attacks."
 KOR_imitate_the_west: "Imitate the West"
 KOR_imitate_the_west_desc: "The Korean government has decided to adopt the western doctrines, we will seek to improve our text books and technologies."
 KOR_quantity_over_quality: "Quantity Over Quality"
 KOR_quantity_over_quality_desc: "It is better for our troops to have old or ordinary equipment than having no equipment."
 KOR_never_surrender: "Never Surrender"
 KOR_never_surrender_desc: "Getting our independence back was a great struggle, and we won't renounce to it so easily this time."
 KOR_guerrilla_warfare: "Guerrilla Warfare"
 KOR_guerrilla_warfare_desc: "The term "Guerilla warfare" was coined in the context of the Peninsular War in the 19th century, it consists in not engaging in open combat, using hit and run tactics and encircling the enemy divisions. This approach will be great to defend our nation."
 KOR_hill_fighters: "Hill Fighters"
 KOR_hill_fighters_desc: "The Korean guerrillas are accustomed to fighting in hills and mountains, we will integrate the best guerrillas and train them to become the first special forces of Korea."
 KOR_integrate_the_militias: "Integrate the Militias"
 KOR_integrate_the_militias_desc: "We will seek to integrate all the Uibyeong in the Korean army. The more, the better."
 KOR_qualitity_over_quantity: "Quality Over Quantity"
 KOR_qualitity_over_quantity_desc: "We won't be able to defeat no army if ours is armed with laughable weapons, we must meet the current standards now."
 KOR_replicate_the_stahlhelm: "Replicate the Stahlhelm"
 KOR_replicate_the_stahlhelm_desc: "Just like the Chinese, we will begin the use of the Stahlhelm in our army, to better protect our soldiers, and our homeland."
 KOR_the_importance_of_artillery: "The Importance of Artillery"
 KOR_the_importance_of_artillery_desc: "The west has taught us the importance of having artillery prepared for the fight, we will make sure that every regiment has some."
 KOR_winter_corps: "Winter Corps"
 KOR_winter_corps_desc: "Korea is known for its cold winters. We must accustome our armies to these harsh conditions if we want to be able to fight back."
 KOR_new_text_books: "New Text Books"
 KOR_new_text_books_desc: "Now that the new reforms has been made, is time to make new text books."
 KOR_the_new_korean_army: "The New Korean Army"
 KOR_the_new_korean_army_desc: "The new Korean army shines with its power, now any nation will have to think twice before invading us."
 KOR_protect_our_coast: "Protect our Coasts"
 KOR_protect_our_coast_desc: "Fortifying our coasts will protect us from any naval invasions carried out by Japan or the Soviets."
 KOR_fortify_the_nort: "Fortify the North"
 KOR_fortify_the_nort_desc: "Fortifying the north will protect us better from any Chinese, Russian or Manchurian invasion."
 KOR_build_a_prideful_navy: "Build a Prideful Navy"
 KOR_build_a_prideful_navy_desc: "If we don't want to be invaded again, we must try to improve our navy as much as possible."
 KOR_learn_from_the_wolves: "Learn from the Wolves"
 KOR_learn_from_the_wolves_desc: "Wolves hunt in packs, attacking bigger preys from all sides and pursuing them until they fall dead. Our submarines might learn one or two things of them."
 KOR_learn_from_the_bear: "Learn from the Bear"
 KOR_learn_from_the_bear_desc: "Bears are solitary, but powerful animals. Almost no other creature in the nature can defeat them, and our navy will try to follow their example."
 KOR_design_destroyers: "Design Destroyers"
 KOR_design_destroyers_desc: "We will make our best efforts to design new destroyers able to compete with the Japanese and European technologies."
 KOR_design_cruisers: "Design Cruisers"
 KOR_design_cruisers_desc: "We will make our best efforts to design new cruisers able to compete with the Japanese and European technologies."
 KOR_design_battle_ships: "Design Battleships"
 KOR_design_battle_ships_desc: "We will make our best efforts to design new battleships able to compete with the Japanese and European technologies."
 KOR_design_submarines: "Design Submarines"
 KOR_design_submarines_desc: "We will make our best efforts to design new submarines able to compete with the Japanese and European technologies."
 KOR_make_the_pack_bigger: "Make the Pack Bigger"
 KOR_make_the_pack_bigger_desc: "The Korean nation in 1936 had no submarines, and thus we will seek to produce as many as possible to be able to compete with the major nations of the world."
 KOR_on_our_way_to_naval_dominance: "On our Way to Naval Dominance"
 KOR_on_our_way_to_naval_dominance_desc: "Now that we have updated the models of our over and undersea navy, and learnt new naval doctrines, it's time to pursue naval dominance in Asia."
 KOR_slay_the_dragons: "Slay the Dragons"
 KOR_slay_the_dragons_desc: "After the creation of the Voisin III in 1914, the skies of the world have been full of dragons able to destroy and burn entire cities en a couple of minutes. We can not compete with them in the air, but we shall compete with them in the ground."
 KOR_become_the_dragon: "Become the Dragon"
 KOR_become_the_dragon_desc: "After the creation of the Voisin III in 1914, the skies of the world have been full of dragons able to destroy and burn entire cities en a couple of minutes. We will try our best to become the new dragons of Asia, and defeat them in their own game."
 KOR_take_the_dragons_down: "Take the Dragons Down"
 KOR_take_the_dragons_down_desc: "If we want to make sure that we defeat the dragons, we have to improve our anti-air defenses. We will begin our investigations today."
 KOR_keep_the_skies_clear: "Keep the Skies Clear"
 KOR_keep_the_skies_clear_desc: "We will try to imitate the British example to make our cities impossible to bomb, and if we can't, at least bring some pilots down with us."
 KOR_no_bomb_shall_reach_seoul: "No Bomb Shall Reach Seoul"
 KOR_no_bomb_shall_reach_seoul_desc: "Our skies will become impenetrable, every city shall hold an anti-air position to defend itself, and every citizen will know what to do in case of bombing."
 KOR_say_goodbye_to_the_voisins: "Say Goodbye to the Voisins"
 KOR_say_goodbye_to_the_voisins_desc: "Now that eveery Korean city and division has anti-air positions with them, we can say goodbye to the dragons."
 KOR_investigation_against_the_clock: "Against the Clock"
 KOR_investigation_against_the_clock_desc: "The only plane ever researched by the Korean nation is an old design from the interwar period. We have to make new designs now, before enemy bombers and fighters fill our skies."
 KOR_bring_them_to_hell: "Bring them to Hell"
 KOR_bring_them_to_hell_desc: "We will research our first bombers, to then bring our enemy nations to hell."
 KOR_investigate_western_strategies: "Investigate Western Strategies"
 KOR_investigate_western_strategies_desc: "We will investigate the western air doctrines so we can compete with the airforces of our enemies."
 KOR_defend_our_skies: "Defend our Skies"
 KOR_defend_our_skies_desc: "Now that we have accustomed our factories to plane production, we can defend, and terrify the skies."
 KOR_the_korean_turing: "The Korean Turing"
 KOR_the_korean_turing_desc: "Alan Turing is an English mathematician and pioneer of theoretical computer science. He is currently helping the British to crack the codes of their enemies, but who says that we can't find our own Turing here in Korea?"
 KOR_the_first_korean_radar: "The First Korean RADAR"
 KOR_the_first_korean_radar_desc: "Using technologies provided by the British Empire, we will try to build the first Asian RADAR."
 KOR_bring_democracy_to_asia: "Bring Democracy to Asia"
 KOR_bring_democracy_to_asia_desc: "Asia has for centuries been slaved by despotism, communism and imperialism. If we want to bring peace, we can't let this continue."
 KOR_proclaim_the_anarchist_state: "Proclaim the Anarchist Revolution"
 KOR_proclaim_the_anarchist_state_desc: "Nor communism, fascism, monarchies or democracies can save Korea. Our only option is anarchy, where every Korean will be truly free!"
 KOR_aftermath_of_the_kim_plot: "Aftermath of the Kim Plot"
 KOR_aftermath_of_the_kim_plot_desc: "After the Kim plot, the storm has ended. Let's hope the calm comes quickly."
 KOR_purge_the_traitors: "Purge the Traitors"
 KOR_purge_the_traitors_desc: "After the Kim Plot, army chief Lee Beom-seok began purging Korea from communists, anarchists and fascists, so an event like this doesn't repeat ever again."
 KOR_collectivize_korea: "Collectivize Korea"
 KOR_collectivize_korea_desc: "For an anarchist society to function, every member of the commune must renounce to its individuality, now we are all one, marching towards progress!"
 KOR_total_equality: "Total Equality"
 KOR_total_equality_desc: ""All men are equal." But what about women? In our commune, both will have the same rights, and of course, duties."
 KOR_bring_kim_il_sung_back_from_exile: "Bring Kim Il-sung Back from Exile"
 KOR_bring_kim_il_sung_back_from_exile_desc: "Kim Il-sung was kicked out from the country after the king came back to the nation. Now that the old government and the king are gone, it's time to bring back the red general."
 KOR_mold_the_korean_mind: "Mold the Korean Mind"
 KOR_mold_the_korean_mind_desc: "We must re-educate the Korean people to impede any revolts and revolutions in the future."
 KOR_deal_with_the_reds: "Deal with the Reds"
 KOR_deal_with_the_reds_desc: "We will give enormous benefits to the communist generals and politicians so we have no enemies inside the Korean nation."
 KOR_anarcho_communism: "Anarcho-Communism"
 KOR_anarcho_communism_desc: "The destruction of capitalism, wage labour and private property in favor of common ownership of the means of production and direct democracy, who wouldn't want to live in a country like that?"
 KOR_the_one_people_theory: "The One People Theory"
 KOR_the_one_people_theory_desc: "Shin Chae-ho thinks that modern Koreans and the people of Manchuria were of a single race which has an ancestral claim to both Korea and Manchuria. We shall fulfill that claim now."
 KOR_proclaim_the_east_asian_state: "Procleam the East Asian State"
 KOR_proclaim_the_east_asian_state_desc: "The only way to stabilize East Asia is by bringing anarchism to it, we must unite all the East Asian lands under one nation!"
 KOR_liberate_north: "Liberate the North"
 KOR_liberate_north_desc: "The revolution marches northwards."
 KOR_liberate_west: "Liberate the West"
 KOR_liberate_west_desc: "The revolution marches westwards."
 KOR_liberate_center: "Liberate the Heart"
 KOR_liberate_center_desc: "The revolution marches to the heart of China."
 KOR_liberate_south: "Liberate the South"
 KOR_liberate_south_desc: "The revolution marches southwards."
 KOR_liberate_islands: "Liberate the Islands"
 KOR_liberate_islands_desc: "The revolution will come to the islands."
 KOR_liberate_the_sons_of_mother_anarchy: "Liberate the Sons of Mother Anarchy"
 KOR_liberate_the_sons_of_mother_anarchy_desc: "The sons of mother anarchy are enslaved by the western dictatorships, it is our duty to liberate them."
 KOR_integrate_the_iberian_anarchists: "Integrate the Iberian Anarchists"
 KOR_integrate_the_iberian_anarchists_desc: "We will reach out the anarchists of Iberia, for alliance purposes.... Yeah..."
 KOR_end_the_regency: "End the Regency"
 KOR_end_the_regency_desc: "The military junta of Korea decided that the best way to assure the stability of Korea is by restoring the Korean throne. However, a big problem remains about who is the legitimate heir of the Korean throne."
 KOR_mandatory_military_training: "Mandatory Military Training"
 KOR_mandatory_military_training_desc: "If we want to be able to defend our nation of foreign threats, every Korean should know how to use a rifle. This will also benefit them, by giving them benefits for being in the army, like cheaper healthcare and ensuring they have a good living place."
 KOR_jeogyeogbyeong: "Jeogyeogbyeong"
 KOR_jeogyeogbyeong_desc: "Jeogyeogbyeong is the name that snipers get in Korea. In Europe it has been proved that snipers have an important role in battles, and thus it would be beneficial for our army to have some snipers in every battalion."
 KOR_japanese_dockyards: "Japanese Dockyards"
 KOR_japanese_dockyards_desc: "We will make deals with the Japanese so we can get some dockyards to expand our navy."
 KOR_acquire_japanese_designs: "Acquire Japanese Designs"
 KOR_acquire_japanese_designs_desc: "The Japanese have designed a new model of torpedoes, capable of defeating any western ships. It would be nice of them if they shared those designs with us."
 KOR_the_best_ships_of_asia: "The Best Ships of Asia"
 KOR_the_best_ships_of_asia_desc: "We will research new ship designs so we are able not only to compete, but surpass the western and Japanese ships."
 KOR_the_devil_you_know: "The Devil You Know"
 KOR_the_devil_you_know_desc: "Many people might be furious about the government decision to reapproach the Japanese, but as people say, better the devil you know than the devil you don't."
 KOR_seek_help_from_the_kaiserreich: "Seek Help from the Kaiserreich"
 KOR_seek_help_from_the_kaiserreich_desc: "When we were invaded by the Japanese in 1905, neither the Russians, nor the Americans, nor the British stood up for us. We can't believe on them, and thus, our only option currently is the enemy of the three of them, the German Empire."
 KOR_reorganize_the_state: "Kim's Dream"
 KOR_reorganize_the_state_desc: "President Kim Il-sung will begin his mission of transforming Korea into a shining communist nation, as it should be!"
 KOR_achieve_total_power: "Achieve Total Power"
 KOR_achieve_total_power_desc: "The only fit man to lead Korea is our savior Kim Il-sung, and thus, all those who oppose him, or may do it in the future, deserve to be excecuted."
 KOR_restore_the_caste_system: "Restore the Caste System"
 KOR_restore_the_caste_system_desc: "What Korea needs is a way of classifying her citizens among those that are loyal to the country, those that indifferent about it and those that deserve to die."
 KOR_cultivate_fanatism: "Cultivate Fanatism"
 KOR_cultivate_fanatism_desc: "All Koreans shall love our leader and saviour, Kim Il-sung!"
 KOR_state_of_constant_war: "State of Constant War"
 KOR_state_of_constant_war_desc: "We must teach the citizens of Korea how war feels like, and will be, so they are always prepared to live under one."
 KOR_massive_purges: "Massive Purges"
 KOR_massive_purges_desc: "What our nation needs to stabilize is get rid of those that are against our perfect government and leader."
 KOR_approach_the_soviets: "Approach the Soviets"
 KOR_approach_the_soviets_desc: "The Soviet Union gladly helped the communist generals in exile after the Japanese invaded Korea. We should formalize our new alliance."
 KOR_make_the_sun_bleed: "Make the Sun Bleed"
 KOR_make_the_sun_bleed_desc: "We will make the rising sun bleed until it turns entirely red for what they did to us in 1905."
 KOR_reeducation_campaign: "Reeducation Campaign"
 KOR_reeducation_campaign_desc: "We will aim to re-educate our people so they know what they really need to know. Those that refuse will have to pray for their lives."
 KOR_forced_labor: "Forced Labor"
 KOR_forced_labor_desc: "Those that dare to oppose our government shall work for us for the rest of their lifes, unless our great leader decides to kill them, of course."
 KOR_kim's_last_laugh: "Kim's Last Laugh"
 KOR_kim's_last_laugh_desc: "We must research nuclear weapons so if we ever get invaded, Kim laughs last."
 KOR_korean_rocketry: "Korean Rocketry"
 KOR_korean_rocketry_desc: "Our country would be benefited by having rockets, let's try to get some."
 KOR_all_shall_serve: "All Shall Serve"
 KOR_all_shall_serve_desc: "We will expand our army so no one will be able to defeat us!"
 KOR_pay_our_debt: "Pay our Debt"
 KOR_pay_our_debt_desc: "The People's Republic of China sheltered many of our generals and politicians after their exile from the Japanese occupation, now that they're fighting in their last struggle, it's time to pay our debt."
 KOR_contact_the_manchurian_guerrillas: "Contact the Manchurian Guerrillas"
 KOR_contact_the_manchurian_guerrillas_desc: "Manchuria is infested by democratic, anti-japanese and anti-qing guerrillas. Contacting them and integrating them in our army will surely benefit our country."
 KOR_the_election_question: "Hold the First Korean Elections"
 KOR_the_election_question_desc: "Now that our nation is stable again, it is time to let the Korean people choose their new president."
 KOR_assassinate_kim_il_sung: "Assassinate Kim Il-sung"
 KOR_assassinate_kim_il_sung_desc: "Now that we are aiming to reach full anarchism in Korea, there is only one obstacle: Kim Il-sung. Due to his personality and political inclinations, he has been criticizing our government since the Kim plot. It is time to make him mysteriously dissapear."
 KOR_the_dragon_corps: "The Dragon Corps"
 KOR_the_dragon_corps_desc: "It is impossible for us to manage to invade the home islands through the sea. Nonetheless, the Japanese demon will be horrified when they see their doom falling form the sky."
 KOR_the_great_reformer: "The Great Reformer"
 KOR_the_great_reformer_desc: "Yi Kang visited many countries in his youth. He worked in the embassy of Japan, the United Kingdom, Germany, France, Russia, Italy and Austria-Hungary, as well as studing in the Keio University of Tokyo and the Roanoke College in the USA. After traveling through so many developed countries, Yi Kang noticed that the only way to assure Korean stability, is by not falling behind the rest of the world."
 KOR_japanese_teachings: "Japanese Teachings"
 KOR_japanese_teachings_desc: "The reason why we were so easily defeated by the Japanese was due to our technological differences, and the poor quality of our army. We must learn from them in order to grow stronger."
 KOR_improve_the_korean_rails: "Improve the Korean Rails"
 KOR_improve_the_korean_rails_desc: "We should improve the railroads of Korea to meet the European standars of transport."
 KOR_reconcile_with_japan: "Reconcile with Japan"
 KOR_reconcile_with_japan_desc: "Now that the Japanese see us as an opponent instead of a subject, we could coerce them into investing in our country and companies, and if we are lucky, into enacting a non-aggression pact."
 KOR_jomyeong_jeonjaeng: "Jomyeong Jeonjaeng"
 KOR_jomyeong_jeonjaeng_desc: "Jomyeong Jeonjaeng, meaning "Thunder War" is the new doctrine that we will aim to teach to our soldiers, imitating the famous German Blitzkrieg. However, concentrating all our efforts into improving the quality of the army would surely anger the navy."
 KOR_make_yi_sun_proud: "Make Yi Sun Proud"
 KOR_make_yi_sun_proud_desc: "Yi Sun was a Korean admiral and military general who turned into a national hero for his victories against the Japanese navy during the Japanese invasions of Korea in the 16th century. We will aim to make our great admiral proud by beginning the rebirth of the Korean navy. However, concentrating all our efforts into expanding our the navy would surely anger the army."
 KOR_believe_in_the_west: "Believe in the West"
 KOR_believe_in_the_west_desc: "The Western nations abandoned us when Japan invaded us in 1905, after years of exploitation they did't hesitated to leave us to our fate. However, now that instability reigns in Europe, they will be more than willing to acquire new allies."
 KOR_the_enemy_of_our_enemy: "The Enemy of our Enemy"
 KOR_the_enemy_of_our_enemy_desc: "The Chinese have had a historic rivalry with Japan. It is more than likely that they will be willing to let us join them."
 KOR_one_thousand_years_of_neutrality: "1000 Years of Neutrality"
 KOR_one_thousand_years_of_neutrality_desc: "We shall turn into an impenetrable nation and avoid any conflicts, so the Japanese, the Chinese and the Russians don't have a reason to invade us ever again."
 KOR_buy_european_ships: "Buy European Ships"
 KOR_buy_european_ships_desc: "The Europeans will be more than willing to help their new ally to increase the size and quality of their navy."
 KOR_experimental_armored_division: "Experimental Armored Division"
 KOR_experimental_armored_division_desc: "The Japanese and the Germans terrified their enemies with their tank divisions, having some for us will give us a great advantage in combat."
 KOR_mobile_artillery: "Mobile Artillery"
 KOR_mobile_artillery_desc: "Artillery and armored divisions dominate the battlefields all along the world. Being able to produce self-propelled artillery would surely improve the performance of our armed forces."
 KOR_stab_the_sun: "Stab the Sun"
 KOR_stab_the_sun_desc: "The sky itself will stab the sun's heart."
 KOR_the_jiandao_issue: "The Jiandao Issue"
 KOR_the_jiandao_issue_desc: "For centuries Jiandao, also called Gando in Korean, has been inhabited by almost only Koreans. Many people among our government have been proposing to ask control of the region to the Chinese as a sort of payment for our support in the war, and that's what we are going to, politely, do."
 KOR_seek_help_from_the_west: "Seek Help from the West"
 KOR_seek_help_from_the_west_desc: "The Western nations abandoned us when Japan invaded us in 1905, after years of exploitation they did't hesitated to leave us to our fate. However, now that instability reigns in Europe, they will be more than willing to acquire new allies."
 KOR_seek_help_from_the_russians: "Seek Help from the Russians"
 KOR_seek_help_from_the_russians_desc: "The Russians were unable to defeat the Japanese in 1905. However, now that they have industrialized and improved the quality of their army, they may be willing to protect us again."
 KOR_seek_help_from_the_kuomintang: "Seek Help from the Kuomintang"
 KOR_seek_help_from_the_kuomintang_desc: "If the Chinese manage to reunify their nation again, they will turn into one of the strongest nations in the world. It would be a good idea to have them in our side."
 KOR_cheolgi_regime: "Cheolgi Regime"
 KOR_cheolgi_regime_desc: "Lee Beom-seok, also known as Cheolgi ("Made of steel" in Korean), has decided that the only way to keep Korea free is a strong and militaristic goverment, led by himself. Democracy will come once there are no menaces to the Korean nation in Asia."
 KOR_jokcheong: "Jokcheong"
 KOR_jokcheong_desc: "The "Joseon Minjog Cheongnyeondan" (meaning Korean National Youth Group), usuallly abbreviated Jokcheong, is an anti-communist paramilitary group founded by Lee Beom-seok, fueled by the Danjisamchik doctrine."
 KOR_jeogyeogbyeong2: "Jeogyeogbyeong"
 KOR_jeogyeogbyeong2_desc: "Jeogyeogbyeong is the name that snipers get in Korea. In Europe it has been proved that snipers have an important role in battles, and thus it would be beneficial for our army to have some snipers in every battalion."
 KOR_we_shall_not_fall: "We Shall Not Fall"
 KOR_we_shall_not_fall_desc: "Every Korean must do its part so an "Ilje Sidae" never happens again."
 KOR_meet_western_standars: "Meet Western Standars"
 KOR_meet_western_standars_desc: "We must modernize our army quickly if we don't want the Japanese or the Russians to conquer our nation again."
 KOR_learn_from_the_germans: "Learn from the Germans"
 KOR_learn_from_the_germans_desc: "Britain and France still believe in their slow and rigid doctrines from the Great War, unlike the Germans who as we, have realized that Jomyeong Jeonjaeng (meaning Thunder War) is the new doctrine that we will bring victory to our nation."
 KOR_join_the_devil: "Join the Devil"
 KOR_join_the_devil_desc: "We don't care about the German crimes or politics, as long as they are willing to help us defeat our enemies."
 KOR_begin_the_crusade: "Begin the Crusade"
 KOR_begin_the_crusade_desc: "We can't rely on foreign nations to defeat our enemies, if we want to wipe communism out of Asia, we must lead the crusade alone."
 KOR_join_the_kuomintang: "Join our Brothers"
 KOR_join_the_kuomintang_desc: "The Kuomintang, as well as us, is known for its anit-communism and its struggle against the terrorist organizations funded by the Soviets. We must join our brothers against their fight against communism and the Japanese!"
 KOR_german_military_mission: "German Military Mission"
 KOR_german_military_mission_desc: "Bringing German officers to train our soldiers would greatly increase the quality of our doctrines, as well as the performance of our armies."
 KOR_german_led_division: "German Led Division"
 KOR_german_led_division_desc: "Naturally Germans will not be able to send a full military mission to the other side of the world. However, letting German officers directly lead an experimental armored division will greatly increase its capabilities in the battlefield."
 KOR_liberate_yanbian: "Liberate Jiandao"
 KOR_liberate_yanbian_desc: "Jiandao, also known as Gando in Korean, is a region populated almost entirely by Koreans, after their ancestors began settling there in the 19th century. We must liberate them from their oppressors once we are ready."
 KOR_reunite_goguryeo: "Reunite Goguryeo"
 KOR_reunite_goguryeo_desc: "Goguryeo, also known as Goryeo or Koryeo, was one of the three kingdoms of Korea, existing from the 1st century BC until the 7th century AC. After centuries of humillation against the Korean nation, it is time to revive Goguryeo from the ashes, to then burn communism down."
 KOR_naval_effort: "Naval Effort"
 KOR_naval_effort_desc: "We must make an effort to build a naval force able to fight the ones of our enemies, or at least keep the Japanese and Russians busy enough not to invade our shores."
 KOR_a_fair_deal: "A Fair Deal"
 KOR_a_fair_deal_desc: "Now that we have consolidated our nation, it is time to take control of Jiandao, a region mostly populated by Koreans. After all, we deserve it in exchange for all the Koreans who have died figthing against the Japanese, don't we?"
 KOR_the_red_scare: "The Red Scare"
 KOR_the_red_scare_desc: "Having an anti-communist government is not enough. We must destroy communism in Asia, only then we and our brothers in arms will be able to live peacefully."

 KOR_neutrality_party: "Monarchist Supporters"
 KOR_anarchism_party: "Anarchism"
 KOR_ac_party: "Anti-communist Coalition"
 KOR_junta: "Military Council"
