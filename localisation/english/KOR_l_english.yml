 kor.1.d: "Stability in Korea could not be achieved when radicals like Kim Il-sung and Shin Chae-ho keep poisoning the youth minds. Therefore, after considering the advices of his ministers, Kim Koo took the difficult decision of ordering the assassination of Kim Il-sung andShin Chae-ho. Their death wasn't ignored by their many followers, who ended up rioting in the streets of Seoul, Busan and Pyongyan, destroying street lights and burning the respective plazas. \nThese demonstrators were met by bullets of the police and the army, thing that provoked the resignation of many of our generals."
 kor.1.a: "If lucky, our future will be brighter..."
 kor.2.d: "Finally the first Korean elections have been carried out! After a full day of vote counting, the winner has been revealed, he being:" 
 kor.2.a: "Kim Koo, the Korean hero!"
 kor.2.b: "Syngman Rhee, the Anti-communist."
 kor.3.d: "The military junta led by Lee Beom-seok didn't last long after the anarchist generals tried to take power, succeding in their mission. A gunfight was heard in the morning in the former royal palace, Ji Cheon-cheong and Hong Beom-do were shot to death, while Lee Beom-seok was found dead in his car some streets away of the palace. Hours after, Kim Il-sung, Kim Won-bong and Kim Jwa-jin announced by radio that the only way to save the nation was through an anarchist government. They also stated that the famous anarchist philosopher, Shin Chae-ho, will be coming back from exile in China to help stabilize the nation" 
 kor.3.a: "Sacrifices have to be made."
 kor.5.d: "The military junta led by Lee Beom-seok didn't last long after the anarchist and communist generals tried to take power, but fortunately they failed in their mission. A gunfight was heard in the morning in the royal palace, Hong Beom-do was shot in the arm and shoulder by anarchist generals, the shoots were heard by the guard of the palace who caught Kim Jwa-jin and Kim Won-bong red-handed, to then proced to shot the anarchist generals to death. Lee Beom-seok reported that he was attacked by Kim Chaek in his way home, he also said that he was very lucky and would probably be dead if the man's gun didn't jammed. However, the assassin managed to scape before Lee had the opportunity to shoot back. Now general Hong Beom-do is being transported to Seoul hospital, before entering the ambulance which he stated that he was fine and it would take more than two traitors to take him down. Finally, Hong Beom-do assured the press that the junta now has the duty to execute all the generals who collaborated in the plot."
 kor.5.a: "Hopefully this is the end of the storm."
 kor.6.d: "The military junta of Korea decided that the best way to assure the stability of Korea is by restoring the Korean throne. However, a big problem remains about who should be the new leader of the Korean nation. \n\nIn one hand, Yi Kang is the eldest song of emperor Gojong, nonetheless he was born by Lady Jang, a court lady-in-waiting of King Gojong, not the king's official consort or concubine, therefore having a king with that lineage would be humillating for our population. \n\nIn the other hand there's Yi Un, son of Emperor Gojong and Imperial Noble Consort Sunheon, who would be the perfect option if it wasn't for the fact that he was the protégé of emperor Meiji himself, and was a general of the Japanese army." 
 kor.6.a: "Yi Kang is the only option."
 kor.6.b: "We shall pardon and crown Yi Un."
 kor.7.d: "A delegation from Korea has approached us today, offering another deal. They propose to renovate the non-aggression pact between our nations, as well as giving military access to our armies again in exchange of guaranteeing their independence in case of a foreign attack. How should we respond?"
 kor.7.a: "This would benefit us both."
 kor.7.b: "We won't negotiate with former subjects."
 kor.8.d: "The Korean government has approached us today asking something incredibly polemic: the annexation of the province of Jiandao, populated almost entirely by Koreans. Jiandao has been part of China since the times of the times of the Qing dynasty, however, transfering the region could impede any irredentist movements in the future, as well as assuring Korean support in future wars. What shall we do?"
 kor.8.a: "Okay, they can have it, but nothing else."
 kor.8.b: "How dare they?"
 kor.9.d: "Today the Koreans approached our delegation with an interesting proposition. They said that if we guarantee their independence in case of a foreign attack, they would concede us a favourable trade deal. How should we respond?"
 kor.9.a: "Sounds like a good proposition."
 kor.9.b: "It's not worth the risk."
 kor.10.desc: "Now that the kingdom has been restored, it is time to choose which flag will represent the Korean nation."
 kor.10.a: "Our current flag is perfect."
 kor.10.b: "The flag of 1882 will represent our nation."
 kor.10.c: "A flag with the seal of the Yi family is the right option."
 kor.10.d: "A flag with the seal of the Yi family, but not forgetting the symbols of the four elements."

